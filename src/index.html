<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Scua Logon</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Protótipo do Scua Logon: hora extra só com aprovação do gestor e regras de jornada, com dados fictícios."
    />
    <!-- Fora dos buscadores: é uma demonstração com dados fictícios e links de aprovação com token.
         O robots.txt deixa o buscador abrir a página justamente para ele ler este noindex. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- A barra laranja do cabeçalho. SVG de 132 bytes, no lugar do favicon.ico padrão (15 kB). -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Aplica o tema escolhido antes do app carregar, para a página não abrir no tema errado.
      // Mesma chave e mesmos valores de src/app/core/layout/theme.ts.
      try {
        var theme = localStorage.getItem('scua-tema');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
