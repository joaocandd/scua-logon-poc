<h2 class="title" [id]="data.titleId">{{ data.title }}</h2>
@if (data.message || data.items?.length) {
  <!-- Mensagem e lista juntas descrevem o diálogo (aria-describedby). -->
  <div class="description" [id]="data.messageId">
    @if (data.message) {
      <p class="message">{{ data.message }}</p>
    }
    @if (data.items?.length) {
      <ul class="items">
        @for (item of data.items; track $index) {
          <li>{{ item }}</li>
        }
      </ul>
    }
  </div>
}
<div class="actions">
  <button app-button type="button" variant="secondary" data-autofocus (click)="ref.close(false)">
    {{ data.cancelLabel ?? 'Cancelar' }}
  </button>
  <button app-button type="button" [variant]="data.variant ?? 'primary'" (click)="ref.close(true)">
    {{ data.confirmLabel }}
  </button>
</div>
