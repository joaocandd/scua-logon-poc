name: CI

on:
  push:
  pull_request:

# Um push novo no mesmo branch cancela a execução anterior, que já ficou velha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, testes, build e e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Conferir a cópia do CLAUDE.md para o Copilot
        run: |
          if ! cmp -s CLAUDE.md .github/copilot-instructions.md; then
            echo "::error file=.github/copilot-instructions.md::Está diferente do CLAUDE.md. Rode: cp CLAUDE.md .github/copilot-instructions.md"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Contraste das cores
        run: npm run contrast

      - name: Testes unitários
        run: npm test

      - name: Build
        run: npm run build

      - name: Build do Storybook
        run: npm run build-storybook

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta e acessibilidade
        run: npm run e2e

      - name: Guardar o relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
